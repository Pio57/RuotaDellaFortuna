# Ruota della Fortuna dietro il Traefik già attivo sul VPS (Hostinger): HTTPS e certificato Let's Encrypt
# li gestisce lui, con le etichette qui sotto. Traefik gira in modalità "host" (entrypoint web/websecure,
# certresolver "letsencrypt"): raggiunge il container direttamente sul suo IP, quindi non servono reti esterne
# né porte pubblicate.
#
#   cd /opt/ruota-della-fortuna
#   cp deploy/.env.example deploy/.env      # DOMAIN = nome del VPS (es. srv1977305.hstgr.cloud) o altro dominio
#   docker compose --env-file deploy/.env -f deploy/docker-compose.yml up -d --build
services:
  ruota-della-fortuna:
    build: ..
    container_name: ruota-della-fortuna
    restart: unless-stopped
    volumes:
      - ruota-data:/data
    expose: ["3000"]
    labels:
      - traefik.enable=true
      - traefik.http.routers.ruota.rule=Host(`${DOMAIN}`)
      - traefik.http.routers.ruota.entrypoints=websecure
      - traefik.http.routers.ruota.tls=true
      - traefik.http.routers.ruota.tls.certresolver=${CERT_RESOLVER:-letsencrypt}
      - traefik.http.services.ruota.loadbalancer.server.port=3000
volumes:
  ruota-data:
