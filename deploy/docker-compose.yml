# Chi è Pio? accanto al template "n8n" di Hostinger (Traefik già attivo in Docker, gestisce HTTPS).
# Il container si unisce alla rete di Traefik e non pubblica porte sull'host.
#
#   git clone <repository> /opt/chi-e-pio && cd /opt/chi-e-pio
#   cp deploy/.env.example deploy/.env      # poi compila DOMAIN e TRAEFIK_NETWORK
#   docker compose --env-file deploy/.env -f deploy/docker-compose.yml up -d --build
#
# Nomi di rete, entrypoint e certresolver vanno verificati sul VPS:
#   docker ps --format '{{.Names}}' | grep -i traefik
#   docker inspect <container traefik> --format '{{range $k,$v := .NetworkSettings.Networks}}{{$k}} {{end}}'
#   docker inspect <container traefik> --format '{{.Args}}'     # cerca certificatesresolvers / entrypoints
services:
  chi-e-pio:
    build: ..
    container_name: chi-e-pio
    restart: unless-stopped
    volumes:
      - chi-e-pio-data:/data
    expose: ["3000"]
    networks: [proxy]
    labels:
      - traefik.enable=true
      - traefik.docker.network=${TRAEFIK_NETWORK}
      - traefik.http.routers.chi-e-pio.rule=Host(`${DOMAIN}`)
      - traefik.http.routers.chi-e-pio.entrypoints=websecure
      - traefik.http.routers.chi-e-pio.tls=true
      - traefik.http.routers.chi-e-pio.tls.certresolver=${CERT_RESOLVER:-mytlschallenge}
      - traefik.http.services.chi-e-pio.loadbalancer.server.port=3000
volumes:
  chi-e-pio-data:
networks:
  proxy:
    external: true
    name: ${TRAEFIK_NETWORK}
